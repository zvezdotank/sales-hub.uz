<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ metaTitle }}</title>
<meta name="description" content="{{ metaDescription }}">
<link rel="canonical" href="{{ canonical }}">
{{? noindex }}<meta name="robots" content="noindex, follow">
{{/ noindex }}{{^ noindex }}<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
{{/ noindex }}<meta name="theme-color" content="#05070c">
<meta name="author" content="{{ site.name }}">
<meta name="geo.region" content="UZ-TK">
<meta name="geo.placename" content="{{ site.city }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="{{ site.locale }}">
<meta property="og:title" content="{{ metaTitle }}">
<meta property="og:description" content="{{ metaDescription }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ ogImage }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.name }} — {{ site.tagline }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ metaTitle }}">
<meta name="twitter:description" content="{{ metaDescription }}">
<meta name="twitter:image" content="{{ ogImage }}">

<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/styles.css?v={{ cssVersion }}">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Archivo:wght@400;600;700&amp;family=Share+Tech+Mono&amp;display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Archivo:wght@400;600;700&amp;family=Share+Tech+Mono&amp;display=swap"></noscript>
{{& structuredData }}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ metaTitle }}</title>
<meta name="description" content="{{ metaDescription }}">
<link rel="canonical" href="{{ canonical }}">
{{? noindex }}<meta name="robots" content="noindex, follow">
{{/ noindex }}{{^ noindex }}<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
{{/ noindex }}<meta name="theme-color" content="#05070c">

<!-- Ограничиваем, откуда странице разрешено грузить код и куда отправлять
     данные. GitHub Pages не даёт задавать HTTP-заголовки, поэтому политика
     объявляется мета-тегом. Так подменённый или внедрённый скрипт со стороннего
     домена просто не выполнится, а форма не сможет отправить данные чужому
     адресату. Директива frame-ancestors через мета-тег не работает — от
     встраивания в чужой сайт таким способом не защититься. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.workers.dev; form-action 'self' https://*.workers.dev; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="author" content="{{ site.name }}">
<meta name="geo.region" content="UZ-TK">
<meta name="geo.placename" content="{{ site.city }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="{{ site.locale }}">
<meta property="og:title" content="{{ metaTitle }}">
<meta property="og:description" content="{{ metaDescription }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ ogImage }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.name }} — {{ site.tagline }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ metaTitle }}">
<meta name="twitter:description" content="{{ metaDescription }}">
<meta name="twitter:image" content="{{ ogImage }}">

<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/fonts.css?v={{ fontsVersion }}">
<link rel="stylesheet" href="css/styles.css?v={{ cssVersion }}">
<!-- Шрифты лежат на своём домене: без обращения к Google на каждой
     загрузке. Предзагружаем ровно те наборы, что нужны первому экрану.
     Michroma — логотип в шапке, латиница JetBrains Mono — номер телефона и
     метка миссии. Без этих двух строк браузер находил их только после
     разбора стилей и начинал качать на 292 мс позже: логотип и телефон
     успевали моргнуть запасным шрифтом. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/manrope-cyrillic-400_700.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/manrope-latin-400_700.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/jetbrains-mono-cyrillic-400_500.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/jetbrains-mono-latin-400_500.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/michroma-latin-400.woff2" crossorigin>
{{& structuredData }}
{{? site.ga4 }}
<script>
// Счётчик не подключается на локальной разработке — иначе тестовые открытия
// страниц попадают в статистику наравне с реальными посетителями.
(function () {
  if (/^(localhost|127\.|0\.0\.0\.0|\[?::1\]?)/.test(location.hostname)) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', '{{ site.ga4 }}');

  // Сам gtag.js весит 157 КБ — больше, чем все картинки первого экрана вместе.
  // Поэтому подключаем его не сразу, а после полной загрузки страницы: он
  // перестаёт отнимать канал у шрифтов и фотографии героя. На статистику это
  // не влияет — вызовы gtag() до загрузки скрипта копятся в dataLayer и
  // обрабатываются, как только он приедет.
  var loaded = false;
  var load = function () {
    if (loaded) return;
    loaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.ga4 }}';
    document.head.appendChild(s);
  };

  if (document.readyState === 'complete') load();
  else window.addEventListener('load', load, { once: true });
  // Страховка: если событие load почему-то не наступит, счётчик всё равно
  // подключится. Клик или касание тоже запускают его раньше срока.
  setTimeout(load, 4000);
  ['pointerdown', 'keydown'].forEach(function (e) {
    window.addEventListener(e, load, { once: true, passive: true });
  });
})();
</script>
{{/ site.ga4 }}
